name: Package & Release (Android APK & WebApp)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with artifacts'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # JOB 1: Build Web App & PWA Package
  # =========================================================================
  build-webapp:
    name: Build WebApp Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: npm run build

      - name: Package WebApp Distribution (ZIP)
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          cd dist
          zip -r "../release-artifacts/laya-webapp-v${VERSION}.zip" .
          cd ..

      - name: Upload WebApp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: release-artifacts/laya-webapp-v*.zip
          retention-days: 30

  # =========================================================================
  # JOB 2: Build Android APK
  # =========================================================================
  build-android-apk:
    name: Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Accept Android SDK Licenses & Prepare Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup / Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifacts
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" "release-artifacts/Laya-v${VERSION}.apk"
          else
            echo "Error: APK not found in outputs directory!"
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/Laya-v*.apk
          retention-days: 30

  # =========================================================================
  # JOB 3: Publish Release to GitHub
  # =========================================================================
  publish-release:
    name: Publish Release on GitHub
    needs: [build-webapp, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download WebApp Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: release-files

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files

      - name: Determine Release Tag
        id: release_info
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            TAG_NAME="${REF#refs/tags/}"
            if [[ "$TAG_NAME" != "v${VERSION}" ]]; then
              echo "Tag '$TAG_NAME' must match package.json version 'v${VERSION}'." >&2
              exit 1
            fi
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "Laya (Snapgrid) ${{ steps.release_info.outputs.tag_name }} - Offline Mindful Block Puzzle"
          draft: false
          prerelease: false
          files: |
            release-files/Laya-v${{ steps.app_version.outputs.version }}.apk
            release-files/laya-webapp-v${{ steps.app_version.outputs.version }}.zip
          body: |
            ## Laya - Snapgrid (${{ steps.release_info.outputs.tag_name }})

            *Laya* (लय: Rhythm / Dissolution) — A mindful, production-grade, 100% offline, ad-free Material 3 block puzzle game for Android mobile devices and web browsers with complete multi-language Indian localization.

            ### Downloads
            * **Android APK (`.apk`):** Download `Laya-v${{ steps.app_version.outputs.version }}.apk` directly to your Android device and install.
            * **Offline WebApp Bundle (`.zip`):** Download `laya-webapp-v${{ steps.app_version.outputs.version }}.zip` to host on any static web server or run locally in any browser.

            ### What's New in ${{ steps.release_info.outputs.tag_name }}
            * **Android CI Build Fix:** Replaced deprecated `android-actions/setup-android@v3` (which failed due to obsolete `sdkmanager tools`) with official runner pre-installed Android SDK and SDK 36 build tools with Java 21.
            * **Sanskrit Linguistic Purity for *Laya*:** Corrected "Laya Rhythm" redundancy across all 11 Indic languages; *Laya* (लय) correctly conveys cadence and dissolution without redundant English repetition.
            * **Settings Language Navigation:** Prominent highlighted language selection box inside Settings dialog alongside top header quick switch button.
            * **Vite WebSocket & HMR Stability:** Clean offline runtime without console connection errors.
            * **11 Offline Indian Languages:** English, हिन्दी (Hindi), ಕನ್ನಡ (Kannada), தமிழ் (Tamil), తెలుగు (Telugu), മലയാളം (Malayalam), मराठी (Marathi), বাংলা (Bengali), ગુજરાતી (Gujarati), ਪੰਜਾਬੀ (Punjabi), and संस्कृतम् (Sanskrit).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
