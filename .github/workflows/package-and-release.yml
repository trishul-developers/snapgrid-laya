name: Package & Release (Android APK & WebApp)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with artifacts'
        required: false
        type: boolean
        default: true
permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # JOB 1: Build Web App & PWA Package
  # =========================================================================
  build-webapp:
    name: Build WebApp Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Application
        run: npm run build

      - name: Package WebApp Distribution (ZIP)
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          cd dist
          zip -r "../release-artifacts/laya-webapp-v${VERSION}.zip" .
          zip -r "../release-artifacts/laya-webapp.zip" .
          cd ..

      - name: Upload WebApp Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: release-artifacts/laya-webapp*.zip
          retention-days: 30

  # =========================================================================
  # JOB 2: Build Android APK
  # =========================================================================
  build-android-apk:
    name: Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Accept Android SDK Licenses & Prepare Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup / Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifacts
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" "release-artifacts/Laya-v${VERSION}.apk"
            cp "$APK_PATH" "release-artifacts/Laya.apk"
          else
            echo "Error: APK not found in outputs directory!"
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-artifacts/Laya*.apk
          retention-days: 30

  # =========================================================================
  # JOB 3: Publish Release to GitHub
  # =========================================================================
  publish-release:
    name: Publish Release on GitHub
    needs: [build-webapp, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Read App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download WebApp Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: release-files

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files

      - name: Determine Release Tag
        id: release_info
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            TAG_NAME="${REF#refs/tags/}"
            if [[ "$TAG_NAME" != "v${VERSION}" ]]; then
              echo "Tag '$TAG_NAME' must match package.json version 'v${VERSION}'." >&2
              exit 1
            fi
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "Laya (Snapgrid) ${{ steps.release_info.outputs.tag_name }} - Offline Mindful Block Puzzle"
          draft: false
          prerelease: false
          files: |
            release-files/Laya-v${{ steps.app_version.outputs.version }}.apk
            release-files/Laya.apk
            release-files/laya-webapp-v${{ steps.app_version.outputs.version }}.zip
            release-files/laya-webapp.zip
          body: |
            ## Laya - Snapgrid (${{ steps.release_info.outputs.tag_name }})

            *Laya* (लय: Rhythm / Dissolution) is a 100% offline, ad-free mobile & web block puzzle game with 11 Indian localizations.

            ### Downloads
            * **Android APK (`.apk`):** Download [Laya.apk](https://github.com/trishul-developers/snapgrid-laya/releases/latest/download/Laya.apk) (permanent direct link) or `Laya-v${{ steps.app_version.outputs.version }}.apk` directly to your Android device and install.
            * **Offline WebApp Bundle (`.zip`):** Download [laya-webapp.zip](https://github.com/trishul-developers/snapgrid-laya/releases/latest/download/laya-webapp.zip) (permanent direct link) or `laya-webapp-v${{ steps.app_version.outputs.version }}.zip` to host on any static web server or run locally in any browser.

            ### What's New in ${{ steps.release_info.outputs.tag_name }}
            * **Seamless Over-the-Air Updates:** Network-first service worker and in-app update pill allow clean updates without clearing cache or reinstalling.
            * **Decluttered Header:** Streamlined top bar with 4 spacious in-game controls (Undo, Leaderboard, Settings, Restart).
            * **Redesigned Settings:** Clean Material 3 sections with non-destructive "Save & Apply" staging (board is never interrupted for theme/audio/language changes).
            * **Post Game-Over Board Review:** "View Board" mode allows inspecting the final state with a prominent restart banner.
            * **Rebalanced Polyomino Spawning:** Boosted filler pieces (~55%) and reduced deadlock hazards (3x3 squares, 5-crosses) for smooth, zen gameplay.
            * **Haptics & Battery:** Enabled Android vibration permission and stopped idle RAF cadence loops.
            * **11 Languages:** 100% complete translations for Hindi, Tamil, Telugu, Kannada, Malayalam, Marathi, Bengali, Gujarati, Punjabi, Sanskrit, and English.

            Licensed under the MIT License.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
