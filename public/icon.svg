<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="50%" stop-color="#090D17" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Block Gradients with High Vibrancy -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="30%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="30%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glowParticle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="url(#centerGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="3" />

  <!-- Subtle Ambient Dissolution Particles (Laya) -->
  <g filter="url(#glowParticle)" opacity="0.8">
    <circle cx="92" cy="112" r="5" fill="#38BDF8" />
    <circle cx="120" cy="80" r="3" fill="#A855F7" />
    <circle cx="420" cy="130" r="6" fill="#F59E0B" />
    <circle cx="395" cy="95" r="3.5" fill="#FB7185" />
    <circle cx="85" cy="380" r="4.5" fill="#34D399" />
    <circle cx="425" cy="390" r="5.5" fill="#38BDF8" />
    <circle cx="445" cy="355" r="3" fill="#FDE047" />
  </g>

  <!-- Core Tactile Polyomino Cluster -->
  <g filter="url(#tileShadow)" transform="translate(76, 76)">
    <!-- 2x2 Square (Amber) -->
    <g>
      <rect x="16" y="16" width="148" height="148" rx="22" fill="url(#amberGrad)" />
      <!-- Inner Bevel Highlight -->
      <path d="M 38 18 L 142 18 C 154 18 162 26 162 38 L 162 50 C 150 42 135 38 116 38 L 38 38 Z" fill="rgba(255, 255, 255, 0.35)" />
      <rect x="22" y="22" width="136" height="136" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" />
    </g>

    <!-- 3-tile L-Shape (Cyan) -->
    <g>
      <rect x="194" y="16" width="70" height="70" rx="18" fill="url(#cyanGrad)" />
      <rect x="194" y="94" width="70" height="70" rx="18" fill="url(#cyanGrad)" />
      <rect x="272" y="94" width="70" height="70" rx="18" fill="url(#cyanGrad)" />
      <rect x="198" y="20" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
      <rect x="198" y="98" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
      <rect x="276" y="98" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    </g>

    <!-- 1x3 Vertical Bar (Rose) -->
    <g>
      <rect x="16" y="194" width="70" height="148" rx="18" fill="url(#roseGrad)" />
      <rect x="20" y="198" width="62" height="140" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    </g>

    <!-- Z-Piece (Emerald) -->
    <g>
      <rect x="116" y="194" width="70" height="70" rx="18" fill="url(#emeraldGrad)" />
      <rect x="194" y="194" width="70" height="70" rx="18" fill="url(#emeraldGrad)" />
      <rect x="194" y="272" width="70" height="70" rx="18" fill="url(#emeraldGrad)" />
      <rect x="272" y="272" width="70" height="70" rx="18" fill="url(#emeraldGrad)" />
      <rect x="120" y="198" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
      <rect x="198" y="198" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
      <rect x="198" y="276" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
      <rect x="276" y="276" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    </g>

    <!-- Center Accent Dot (Violet) -->
    <g>
      <rect x="116" y="272" width="70" height="70" rx="18" fill="url(#violetGrad)" />
      <rect x="120" y="276" width="62" height="62" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2" />
    </g>
  </g>
</svg>
