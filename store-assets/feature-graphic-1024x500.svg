<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070C" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Ambient Neon Lights -->
    <radialGradient id="leftGlow" cx="22%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="30%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="15%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Tri-Color Laya Cadence Meter Gradient -->
    <linearGradient id="layaFlowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Isometric Neon Cubes (Aligned with Icon Option 3) -->
    <g id="fgNeonL">
      <polygon points="0,-98 44,-72 0,-46 -44,-72" fill="#F59E0B" fill-opacity="0.9" stroke="#FEF08A" stroke-width="2" />
      <polygon points="-44,-72 0,-46 0,0 -44,-26" fill="#D97706" fill-opacity="0.8" stroke="#FBBF24" stroke-width="1.5" />
      <polygon points="0,-46 44,-72 44,-26 0,0" fill="#92400E" fill-opacity="0.9" stroke="#F59E0B" stroke-width="1.5" />
    </g>

    <g id="fgNeonS">
      <polygon points="0,-98 44,-72 0,-46 -44,-72" fill="#06B6D4" fill-opacity="0.9" stroke="#CFFAFE" stroke-width="2" />
      <polygon points="-44,-72 0,-46 0,0 -44,-26" fill="#0891B2" fill-opacity="0.8" stroke="#22D3EE" stroke-width="1.5" />
      <polygon points="0,-46 44,-72 44,-26 0,0" fill="#155E75" fill-opacity="0.9" stroke="#06B6D4" stroke-width="1.5" />
    </g>

    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1024" height="500" fill="url(#bgBanner)" />
  <rect width="1024" height="500" fill="url(#leftGlow)" />
  <rect width="1024" height="500" fill="url(#cyanGlow)" />
  <rect width="1024" height="500" fill="url(#amberGlow)" />

  <!-- Subtle Blueprint Matrix Grid Lines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="0" y1="50" x2="1024" y2="50" /><line x1="0" y1="100" x2="1024" y2="100" />
    <line x1="0" y1="150" x2="1024" y2="150" /><line x1="0" y1="200" x2="1024" y2="200" />
    <line x1="0" y1="250" x2="1024" y2="250" /><line x1="0" y1="300" x2="1024" y2="300" />
    <line x1="0" y1="350" x2="1024" y2="350" /><line x1="0" y1="400" x2="1024" y2="400" />
    <line x1="0" y1="450" x2="1024" y2="450" />
  </g>

  <!-- Left Hero: Option 3 Isometric Platform with L and S Pieces and Laya Meter -->
  <g filter="url(#fShadow)" transform="translate(195, 235) scale(0.88) translate(-256, -260)">
    <!-- Isometric Neon Floor Matrix -->
    <polygon points="256,184 432,288 256,392 80,288" fill="#0B0F19" stroke="#EC4899" stroke-width="3" stroke-opacity="0.85" />
    <g stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.45">
      <line x1="212" y1="210" x2="388" y2="314" />
      <line x1="168" y1="236" x2="344" y2="340" />
      <line x1="124" y1="262" x2="300" y2="366" />
      <line x1="300" y1="210" x2="124" y2="314" />
      <line x1="344" y1="236" x2="168" y2="340" />
      <line x1="388" y1="262" x2="212" y2="366" />
    </g>

    <!-- Standing Neon L-Piece (Amber) -->
    <use href="#fgNeonL" transform="translate(212, 262)" />
    <use href="#fgNeonL" transform="translate(212, 216)" />
    <use href="#fgNeonL" transform="translate(212, 170)" />
    <use href="#fgNeonL" transform="translate(256, 288)" />

    <!-- Flat Interlocking Neon S-Piece (Cyan) -->
    <use href="#fgNeonS" transform="translate(300, 314)" />
    <use href="#fgNeonS" transform="translate(212, 314)" />
    <use href="#fgNeonS" transform="translate(344, 340)" />
    <use href="#fgNeonS" transform="translate(256, 340)" />

    <!-- Signature "Laya Rhythm Meter" Bar -->
    <g transform="translate(116, 428)">
      <rect width="280" height="14" rx="7" fill="#131B2E" stroke="#1E293B" stroke-width="1.5" />
      <rect width="215" height="14" rx="7" fill="url(#layaFlowBar)" />
      <circle cx="215" cy="7" r="8" fill="#FFFFFF" filter="url(#glowF)" />
    </g>
  </g>

  <!-- Center-Right Branding and Marketing Content -->
  <g transform="translate(435, 75)">
    <!-- Pill Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.5" />
      <text x="95" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="1.2">100% OFFLINE • NO ADS</text>

      <rect x="205" y="0" width="165" height="30" rx="15" fill="rgba(236, 72, 153, 0.12)" stroke="#EC4899" stroke-width="1.5" />
      <text x="287" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#F472B6" text-anchor="middle" letter-spacing="0.8">11 LANGUAGES</text>
    </g>

    <!-- Main Title: LAYA SNAPGRID -->
    <text x="0" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      LAYA <tspan fill="#38BDF8">SNAPGRID</tspan>
    </text>

    <!-- Sanskrit and Subtitle -->
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94A3B8" letter-spacing="0.5">
      लय • The Mindful Sanskrit Block Puzzle
    </text>

    <!-- Feature Highlights Matrix -->
    <g transform="translate(0, 180)" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-3" width="26" height="26" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5" />
        <text x="13" y="15" font-size="13" fill="#F59E0B" text-anchor="middle" font-weight="900">▦</text>
        <text x="36" y="16">Adaptive Grids: 8×8, 10×10 &amp; 12×12</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 42)">
        <rect x="0" y="-3" width="26" height="26" rx="8" fill="rgba(236, 72, 153, 0.15)" stroke="#EC4899" stroke-width="1.5" />
        <text x="13" y="15" font-size="13" fill="#EC4899" text-anchor="middle" font-weight="900">⚡</text>
        <text x="36" y="16">Dynamic Laya Flow &amp; Cadence Multipliers</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 84)">
        <rect x="0" y="-3" width="26" height="26" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" stroke-width="1.5" />
        <text x="13" y="15" font-size="13" fill="#06B6D4" text-anchor="middle" font-weight="900">🎨</text>
        <text x="36" y="16">Material 3 Palettes: Cyber Neon &amp; Terracotta</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(0, 126)">
        <rect x="0" y="-3" width="26" height="26" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" />
        <text x="13" y="15" font-size="13" fill="#10B981" text-anchor="middle" font-weight="900">🛡</text>
        <text x="36" y="16">Zero Tracking • Zero Ads • Battery Optimized</text>
      </g>
    </g>

    <!-- Bottom Regional Callout -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="530" height="34" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">
        🇮🇳 11 Regional Languages: हिन्दी • தமிழ் • తెలుగు • ಕನ್ನಡ • മലയാളം • मराठी • বাংলা • ગુજરાતી...
      </text>
    </g>
  </g>

  <!-- Ambient Sparkles -->
  <g filter="url(#glowF)" opacity="0.8">
    <circle cx="90" cy="110" r="3.5" fill="#F59E0B" />
    <circle cx="340" cy="80" r="4" fill="#06B6D4" />
    <circle cx="380" cy="420" r="3" fill="#EC4899" />
    <circle cx="980" cy="180" r="4.5" fill="#38BDF8" />
    <circle cx="940" cy="420" r="3.5" fill="#F59E0B" />
  </g>
</svg>
