<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172033" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Amber Cube (L) -->
    <linearGradient id="aTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="aLeft2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="aRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Cyan/Mint Cube (S) -->
    <linearGradient id="cTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cLeft2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="cRight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#155E75" />
    </linearGradient>

    <g id="cubeL2">
      <polygon points="0,-98 44,-72 0,-46 -44,-72" fill="url(#aTop2)" />
      <polygon points="-44,-72 0,-46 0,0 -44,-26" fill="url(#aLeft2)" />
      <polygon points="0,-46 44,-72 44,-26 0,0" fill="url(#aRight2)" />
      <polyline points="-44,-72 0,-46 44,-72" fill="none" stroke="#FFEDD5" stroke-width="1.5" stroke-opacity="0.75" />
    </g>

    <g id="cubeS2">
      <polygon points="0,-98 44,-72 0,-46 -44,-72" fill="url(#cTop2)" />
      <polygon points="-44,-72 0,-46 0,0 -44,-26" fill="url(#cLeft2)" />
      <polygon points="0,-46 44,-72 44,-26 0,0" fill="url(#cRight2)" />
      <polyline points="-44,-72 0,-46 44,-72" fill="none" stroke="#CFFAFE" stroke-width="1.5" stroke-opacity="0.8" />
    </g>

    <!-- Ghost Target Tile on Grid -->
    <g id="ghostTile">
      <polygon points="0,-52 44,-26 0,0 -44,-26" fill="#22D3EE" fill-opacity="0.28" stroke="#67E8F9" stroke-width="2" />
    </g>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg2)" />

  <!-- Isometric Board -->
  <polygon points="256,210 432,314 256,418 80,314" fill="#0F172A" stroke="#334155" stroke-width="3" />
  <polygon points="80,314 256,418 256,432 80,328" fill="#1E293B" />
  <polygon points="432,314 256,418 256,432 432,328" fill="#0F172A" />

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="212" y1="236" x2="388" y2="340" />
    <line x1="168" y1="262" x2="344" y2="366" />
    <line x1="124" y1="288" x2="300" y2="392" />
    <line x1="300" y1="236" x2="124" y2="340" />
    <line x1="344" y1="262" x2="168" y2="366" />
    <line x1="388" y1="288" x2="212" y2="392" />
  </g>

  <!-- Glowing Ghost Preview Cells for S-Piece -->
  <use href="#ghostTile" transform="translate(300, 340)" />
  <use href="#ghostTile" transform="translate(212, 340)" />
  <use href="#ghostTile" transform="translate(344, 366)" />
  <use href="#ghostTile" transform="translate(256, 366)" />

  <!-- Placed Flat L-Piece on Left Side of Board -->
  <use href="#cubeL2" transform="translate(212, 288)" />
  <use href="#cubeL2" transform="translate(168, 314)" />
  <use href="#cubeL2" transform="translate(124, 340)" />
  <use href="#cubeL2" transform="translate(168, 366)" />

  <!-- Vertical Snap Guide Beams -->
  <g stroke="#67E8F9" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity="0.6">
    <line x1="212" y1="314" x2="212" y2="255" />
    <line x1="256" y1="340" x2="256" y2="280" />
    <line x1="344" y1="340" x2="344" y2="280" />
  </g>

  <!-- Hovering S-Piece (Elevated 58px above board) -->
  <use href="#cubeS2" transform="translate(300, 282)" />
  <use href="#cubeS2" transform="translate(212, 282)" />
  <use href="#cubeS2" transform="translate(344, 308)" />
  <use href="#cubeS2" transform="translate(256, 308)" />
</svg>
