
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
      <defs>
        <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#070A12" />
          <stop offset="50%" stop-color="#0B0F1C" />
          <stop offset="100%" stop-color="#020408" />
        </linearGradient>
        <radialGradient id="headerGlow" cx="50%" cy="15%" r="45%">
          <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FDE047" /><stop offset="100%" stop-color="#D97706" />
        </linearGradient>
      </defs>

      <!-- Background Base -->
      <rect width="1080" height="1920" fill="url(#bgCanvas)" />
      <rect width="1080" height="600" fill="url(#headerGlow)" />

      <!-- Top Marketing Header Section -->
      <g transform="translate(0, 110)">
        <!-- Pill Badge -->
        <g transform="translate(540, 0)">
          <rect x="-140" y="0" width="280" height="40" rx="20" fill="rgba(255, 255, 255, 0.08)" stroke="#EC4899" stroke-width="2" />
          <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#EC4899" text-anchor="middle" letter-spacing="1.5">PLAY IN YOUR MOTHER TONGUE</text>
        </g>

        <!-- Big Headline -->
        <text x="540" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
          11 INDIAN LANGUAGES
        </text>

        <!-- Subtitle -->
        <text x="540" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle">
          100% Offline Regional Localization
        </text>
      </g>

      <!-- Centered Phone Showcase Frame -->
      
    <g transform="translate(140, 360)">
