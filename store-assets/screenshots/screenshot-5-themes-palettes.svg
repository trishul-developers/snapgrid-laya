
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
      <defs>
        <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#070A12" />
          <stop offset="50%" stop-color="#0B0F1C" />
          <stop offset="100%" stop-color="#020408" />
        </linearGradient>
        <radialGradient id="headerGlow" cx="50%" cy="15%" r="45%">
          <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FDE047" /><stop offset="100%" stop-color="#D97706" />
        </linearGradient>
      </defs>

      <!-- Background Base -->
      <rect width="1080" height="1920" fill="url(#bgCanvas)" />
      <rect width="1080" height="600" fill="url(#headerGlow)" />

      <!-- Top Marketing Header Section -->
      <g transform="translate(0, 110)">
        <!-- Pill Badge -->
        <g transform="translate(540, 0)">
          <rect x="-140" y="0" width="280" height="40" rx="20" fill="rgba(255, 255, 255, 0.08)" stroke="#A855F7" stroke-width="2" />
          <text x="0" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#A855F7" text-anchor="middle" letter-spacing="1.5">DARK AMOLED • LIGHT • NEON • TERRACOTTA</text>
        </g>

        <!-- Big Headline -->
        <text x="540" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
          TACTILE MATERIAL 3 THEMES
        </text>

        <!-- Subtitle -->
        <text x="540" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle">
          Curated Palettes & Full Custom Brick Colors
        </text>
      </g>

      <!-- Centered Phone Showcase Frame -->
      
    <g transform="translate(140, 360)">
      <!-- Phone Outer Shell -->
      <rect x="0" y="0" width="800" height="1420" rx="64" fill="#020408" stroke="#334155" stroke-width="6" />
      <rect x="12" y="12" width="776" height="1396" rx="54" fill="#090D16" />
      
      <!-- Dynamic Island / Speaker Notch -->
      <rect x="290" y="24" width="220" height="32" rx="16" fill="#020408" />
      <circle cx="470" cy="40" r="6" fill="#1E293B" />

      <!-- Screen Content Clip -->
      <g transform="translate(24, 76)">
        
      <!-- Header -->
      <text x="30" y="45" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">THEMES &amp; <tspan fill="#A855F7">PALETTES</tspan></text>

      <!-- 4 Palette Cards -->
      <g transform="translate(20, 80)">
        <!-- Material Pastel -->
        <g transform="translate(0, 0)">
          <rect width="712" height="190" rx="24" fill="#131B2E" stroke="#38BDF8" stroke-width="2"/>
          <text x="35" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Material Pastel</text>
          <text x="35" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">Vibrant balanced colors for mindful play</text>
          <g transform="translate(35, 100)">
            <rect x="0" width="90" height="60" rx="14" fill="#F43F5E"/>
            <rect x="110" width="90" height="60" rx="14" fill="#0EA5E9"/>
            <rect x="220" width="90" height="60" rx="14" fill="#EAB308"/>
            <rect x="330" width="90" height="60" rx="14" fill="#10B981"/>
            <rect x="440" width="90" height="60" rx="14" fill="#8B5CF6"/>
            <rect x="550" width="90" height="60" rx="14" fill="#F97316"/>
          </g>
        </g>

        <!-- Cyber Neon -->
        <g transform="translate(0, 220)">
          <rect width="712" height="190" rx="24" fill="#0B0F19" stroke="#FF007F" stroke-width="2"/>
          <text x="35" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Cyber Neon</text>
          <text x="35" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">High-contrast luminescence for AMOLED screens</text>
          <g transform="translate(35, 100)">
            <rect x="0" width="90" height="60" rx="14" fill="#FF007F"/>
            <rect x="110" width="90" height="60" rx="14" fill="#00F0FF"/>
            <rect x="220" width="90" height="60" rx="14" fill="#FFE600"/>
            <rect x="330" width="90" height="60" rx="14" fill="#39FF14"/>
            <rect x="440" width="90" height="60" rx="14" fill="#B026FF"/>
            <rect x="550" width="90" height="60" rx="14" fill="#FF5F1F"/>
          </g>
        </g>

        <!-- Earthy Terracotta -->
        <g transform="translate(0, 440)">
          <rect width="712" height="190" rx="24" fill="#171A21" stroke="#D4A373" stroke-width="2"/>
          <text x="35" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Earthy Terracotta</text>
          <text x="35" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">Calming organic clay and sage earth tones</text>
          <g transform="translate(35, 100)">
            <rect x="0" width="90" height="60" rx="14" fill="#C85A32"/>
            <rect x="110" width="90" height="60" rx="14" fill="#4E786B"/>
            <rect x="220" width="90" height="60" rx="14" fill="#D4A373"/>
            <rect x="330" width="90" height="60" rx="14" fill="#606C38"/>
            <rect x="440" width="90" height="60" rx="14" fill="#8B5D33"/>
            <rect x="550" width="90" height="60" rx="14" fill="#BC6C25"/>
          </g>
        </g>

        <!-- Monochrome Minimal -->
        <g transform="translate(0, 660)">
          <rect width="712" height="190" rx="24" fill="#0D1117" stroke="#64748B" stroke-width="2"/>
          <text x="35" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Monochrome Slate</text>
          <text x="35" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">Minimalist zen slate shades</text>
          <g transform="translate(35, 100)">
            <rect x="0" width="90" height="60" rx="14" fill="#CBD5E1"/>
            <rect x="110" width="90" height="60" rx="14" fill="#94A3B8"/>
            <rect x="220" width="90" height="60" rx="14" fill="#64748B"/>
            <rect x="330" width="90" height="60" rx="14" fill="#475569"/>
            <rect x="440" width="90" height="60" rx="14" fill="#334155"/>
            <rect x="550" width="90" height="60" rx="14" fill="#1E293B"/>
          </g>
        </g>
      </g>
    
      </g>
    </g>
  
    </svg>
  